name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; se houver duas seguidas, vale a última.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # O repositório é público: a palavra-passe que lá está é só a de
      # desenvolvimento. A do site vem do secret. Ver DECISIONS.md → ADR-025.
      - name: Substituir a palavra-passe pelo secret
        env:
          GATE_PASSWORD: ${{ secrets.GATE_PASSWORD }}
        run: node tools/build-site.js

      - uses: actions/configure-pages@v5

      # Só a pasta do protótipo vai para o ar. Os documentos ficam no repo.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype

      - id: deployment
        uses: actions/deploy-pages@v4
