name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; se houver duas seguidas, vale a última.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # A palavra-passe do site vem do secret GATE_PASSWORD.
      # A que está no repositório é só o valor de desenvolvimento, e num
      # repositório público qualquer pessoa a lê. Ver DECISIONS.md → ADR-024.
      - name: Substituir a palavra-passe pelo secret
        env:
          PW: ${{ secrets.GATE_PASSWORD }}
        run: |
          if [ -n "$PW" ]; then
            sed -i "s/^const GATE_PASSWORD = '.*';/const GATE_PASSWORD = '$PW';/" prototype/js/gate.js
            echo "Palavra-passe substituída pelo secret."
          else
            echo "Sem secret GATE_PASSWORD: fica a do repositório."
          fi

      - uses: actions/configure-pages@v5

      # Só a pasta do protótipo vai para o ar. Os documentos ficam no repo.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype

      - id: deployment
        uses: actions/deploy-pages@v4
